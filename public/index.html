<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f9"><meta name="description" content="日々の学びを、少しずつ。勉強時間とノートを記録するカレンダー。"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css"><title>Study Track — 日々の学びを、少しずつ。</title></head><body><aside class="sidebar"><a class="brand" href="./" aria-label="Study Track ホーム"><span class="brand-icon">▥</span> Study Track<span class="brand-dot">•</span></a><div class="workspace"><span class="avatar">M</span><div>My workspace<small>自分のペースで、学びを積み重ねる</small></div></div><div class="nav-label">WORKSPACE</div></aside><main><header><div class="breadcrumb">My workspace <span>/</span> <b id="page-name">カレンダー</b></div><div class="header-right"><span id="today-label"></span><span class="avatar small">M</span></div></header><section class="content"><div class="stats"><article class="time-hero"><div class="stat-label" id="period-label">今月の勉強時間</div><div class="stat-value"><span id="total">0</span><small>時間</small><small id="total-minutes"></small></div><div class="study-days"><span id="days">0</span>日学習</div><button class="primary" id="add"><span class="add-note-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M7 4.5h9a2 2 0 0 1 2 2V20H7a2.5 2.5 0 0 1-2.5-2.5V7A2.5 2.5 0 0 1 7 4.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M8 4.5V20M11 9h4M11 12h3M5 16h13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="m19 2 .7 1.8 1.8.7-1.8.7L19 7l-.7-1.8-1.8-.7 1.8-.7L19 2Z" fill="currentColor"/></svg></span><span>今日の記録を追加</span></button></article></div><section class="calendar-card" id="calendar-view"><div class="calendar-toolbar"><div class="month-heading"><h2 id="month"></h2><span id="month-en"></span></div><div class="calendar-controls"><button id="prev" aria-label="前の月">‹</button><button id="today">今日</button><button id="next" aria-label="次の月">›</button><span class="view-label">▦ 月表示</span></div></div><div class="weekdays"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div id="calendar" class="calendar"></div><div class="calendar-footer"><span><i></i> 日付をクリックして、勉強の記録やノートを追加</span><div>勉強時間 <span class="legend empty"></span> 少 <span class="legend low"></span><span class="legend mid"></span><span class="legend high"></span> 多</div></div></section><section id="notes-view" hidden><div class="notes-heading"><h2>学びのノート</h2><input id="search" placeholder="ノートを検索…" aria-label="ノートを検索"></div><div id="notes-list"></div></section><div class="app-tools"><details class="mobile-menu"><summary aria-label="設定メニュー">☰</summary><div class="sidebar-bottom"><nav><button class="nav-active" id="calendar-nav"><span>▦</span> カレンダー</button><button id="notes-nav"><span>▤</span> ノート一覧 <b id="note-count">0</b></button></nav><div class="little-quote"><span>✧</span><strong>小さな一歩が、大きな成長に。</strong><p>今日の学びを記録してみましょう。</p></div><button id="install" hidden>↓ アプリをインストール</button><button id="export">↗ データをエクスポート</button><button id="import" aria-label="バックアップをインポート">↙ データをインポート</button><input id="import-file" type="file" accept="application/json" hidden><div class="theme-row"><button id="theme" aria-label="ダークモードに切り替える" title="ダークモードに切り替える">☀</button></div><div class="local-badge"><i></i> データはこの端末に保存されます</div></div></details></div><div class="bottom-caption"><span>✧</span> 昨日より、ほんの少し前へ。 <span class="caption-right">MADE FOR YOUR OWN PACE</span></div></section></main><dialog id="editor" aria-labelledby="editor-title"><form id="entry-form"><div class="dialog-head"><h2 id="editor-title"></h2><button type="button" id="close" class="icon-button" aria-label="閉じる" autofocus>×</button></div><div id="sessions"></div><div class="time-summary"><button type="button" id="add-session">＋ 時間を追加</button><output id="day-total" aria-live="polite">0 分</output></div><section class="note-editor" aria-label="ノート"><input id="note-title" aria-label="ノートのタイトル" placeholder="タイトル" maxlength="120"><div class="note-tools" role="toolbar" aria-label="ノートの書式"><button type="button" data-command="bold" aria-label="太字" aria-pressed="false"><b>B</b></button><button type="button" data-command="insertUnorderedList" aria-label="箇条書き" aria-pressed="false">☷</button></div><div id="note-body" contenteditable="true" role="textbox" aria-label="ノート" aria-multiline="true" spellcheck="true"></div></section><div class="dialog-actions"><button type="button" id="delete" class="danger">記録を削除</button><button type="submit" class="primary">保存</button></div></form></dialog><div id="toast" role="status"></div><script type="module" src="./app.js"></script></body></html>
